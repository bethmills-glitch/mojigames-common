# Render Blueprint — deploys the shared Mojigames online-multiplayer relay server.
#
# This relay is game-agnostic: one deployment backs online play for every Mojigames title
# (Mojino, Mojiventure, Crack the Clip / HitMoji). Since protocol v2 (2026-10-10) a room also
# remembers which game created it, and the relay refuses a join from a different game
# (`wrong-app`) — Mojiventure (kids) rooms are strict. See relay-server/README.md.
#
# How to use (one time):
#   1. Push this repo to GitHub (it already is: bethmills-glitch/mojigames-common).
#   2. Go to https://render.com → New → Blueprint → connect this repo.
#   3. Render reads this file, builds `relay-server`, and gives you a public URL like
#      https://mojigames-relay.onrender.com  (the WebSocket URL is the same with wss://).
#   4. Set EXPO_PUBLIC_RELAY_URL=wss://mojigames-relay.onrender.com when building each app
#      for production (Mojino, Mojiventure, HitMoji all read this same env var — see each
#      app's src/multiplayer/config.ts).
#
# Note: the free plan sleeps after ~15 min idle, so the very first host of a session may
# wait ~50 s while it wakes. Upgrading (Render "Starter", ~$7/month) keeps it always-on — see
# "Hosting plan" in relay-server/README.md. Changing `plan:` below is a BILLING change: only with
# Beth's go-ahead.
services:
  - type: web
    name: mojigames-relay
    runtime: node
    plan: free
    rootDir: relay-server
    buildCommand: npm install
    startCommand: npm start
    # The server answers a plain GET with 200 OK, so the default "/" health check passes.
    healthCheckPath: /
